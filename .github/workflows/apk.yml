name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/apk.yml"
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build APK
        run: |
          gradle -p android assembleRelease --no-daemon \
            -PappUrl="${{ vars.APP_URL || 'https://tezkor-v9wd.onrender.com' }}" \
            -PversionCode=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk apps/web/public/tezkor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tezkor-apk
          path: apps/web/public/tezkor.apk
      # Google Play: the same app as an .aab signed with the private upload key (GitHub Secrets)
      - name: Build AAB for Google Play
        env:
          UPLOAD_B64: ${{ secrets.TEZKOR_UPLOAD_KEYSTORE_B64 }}
          TEZKOR_UPLOAD_PASSWORD: ${{ secrets.TEZKOR_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_B64" ]; then echo "No upload key in GitHub Secrets — AAB skipped"; exit 0; fi
          echo "$UPLOAD_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export TEZKOR_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
          gradle -p android bundleRelease --no-daemon -PplayUpload=1 \
            -PappUrl="${{ vars.APP_URL || 'https://tezkor-v9wd.onrender.com' }}" \
            -PversionCode=${{ github.run_number }}
          mkdir -p play && cp android/app/build/outputs/bundle/release/app-release.aab "play/tezkor-${{ github.run_number }}.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: tezkor-play-aab
          path: play/*.aab
          if-no-files-found: ignore
      - name: Put the APK on the site
        run: |
          git config user.name "tezkor-bot"
          git config user.email "tezkor-bot@users.noreply.github.com"
          git add apps/web/public/tezkor.apk
          git commit -m "APK v1.${{ github.run_number }}" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
