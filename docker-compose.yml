services:
  api:
    image: node:20-alpine
    working_dir: /app
    volumes: [".:/app"]
    command: sh -c "node apps/web/build.mjs && node apps/api/src/index.js"
    environment: { PORT: 8080, DATA_FILE: /app/apps/api/data/db.json }
    ports: ["8080:8080"]
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: somon, POSTGRES_PASSWORD: somon, POSTGRES_DB: somon }
    volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql", "pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
volumes: { pgdata: {} }
